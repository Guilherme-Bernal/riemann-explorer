[package]
name = "riemann-server"
version = "0.2.0"
edition = "2021"

[dependencies]
riemann-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
rayon = "1"
moka = { version = "0.12", features = ["sync"] }